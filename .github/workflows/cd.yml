
name: BrewLite CD - GHCR to Render

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose CD operation'
        required: true
        default: publish_only
        type: choice
        options:
          - publish_only
          - release
          - rollback

      rollback_sha:
        description: 'Full 40-character commit SHA for rollback'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: brewlite-production
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: CI QUALITY GATE
  # ==========================================

  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  # ==========================================
  # JOB 2: VERIFY RELEASE / ROLLBACK
  # ==========================================

  prepare:
    name: Verify release or rollback SHA
    needs: quality
    runs-on: ubuntu-latest

    outputs:
      owner: ${{ steps.release.outputs.owner }}
      version: ${{ steps.release.outputs.version }}
      operation: ${{ steps.release.outputs.operation }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify operation and commit
        id: release
        shell: bash

        env:
          OPERATION: ${{ inputs.operation }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}

        run: |
          set -euo pipefail

          op="${OPERATION:-release}"
          version="$GITHUB_SHA"

          # Only allow manual CD from main.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
             [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual CD must run from main."
            exit 1
          fi

          # Tag-triggered runs must use a release tag.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] &&
             [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Invalid release tag."
            exit 1
          fi

          case "$op" in
            publish_only)
              echo "Publishing Docker images only."
              ;;
            release)
              echo "Publishing and deploying release."
              ;;
            rollback)
              version="$ROLLBACK_SHA"
              echo "Rolling back to an earlier commit."
              ;;
            *)
              echo "::error::Unknown CD operation."
              exit 1
              ;;
          esac

          # Require a full immutable commit SHA.
          if [[ ! "$version" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::A full 40-character SHA is required."
            exit 1
          fi

          # Only release commits reachable from main.
          git fetch origin main

          if ! git merge-base --is-ancestor \
              "$version" origin/main; then
            echo "::error::Commit is not reachable from main."
            exit 1
          fi

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "operation=$op" >> "$GITHUB_OUTPUT"

  # ==========================================
  # JOB 3: BUILD AND PUSH DOCKER IMAGES
  # ==========================================

  images:
    name: Build Docker images and push GHCR

    needs: [quality, prepare]

    if: needs.prepare.outputs.operation != 'rollback'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate production API URL
        shell: bash
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail

          if [[ ! "$PRODUCTION_API_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "::error::Invalid PRODUCTION_API_URL."
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image

      - name: Build and push NestJS API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/assignment2-api:${{ needs.prepare.outputs.version }}

      # Frontend image

      - name: Build and push Next.js Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true

          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/assignment2-web:${{ needs.prepare.outputs.version }}

          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
            NEXT_PUBLIC_MENU_DATA_SOURCE=api
            NEXT_PUBLIC_PRODUCT_DETAIL_ENABLED=true
            NEXT_PUBLIC_PAYOS_ENABLED=${{ vars.PAYOS_FRONTEND_ENABLED }}

      - name: Publish image information
        shell: bash
        env:
          OWNER: ${{ needs.prepare.outputs.owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "### Published Docker images" >> "$GITHUB_STEP_SUMMARY"

          echo "API: ghcr.io/$OWNER/assignment2-api:$VERSION" >> "$GITHUB_STEP_SUMMARY"

          echo "Web: ghcr.io/$OWNER/assignment2-web:$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================
  # JOB 4: DEPLOY TO RENDER
  # ==========================================

  deploy:
    name: Render deployment and production smoke test

    needs: [quality, prepare, images]

    if: >-
      ${{
        always() &&
        needs.quality.result == 'success' &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.operation != 'publish_only' &&
        (
          needs.images.result == 'success' ||
          (
            needs.prepare.outputs.operation == 'rollback' &&
            needs.images.result == 'skipped'
          )
        )
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      # Verify required secrets and variables.

      - name: Verify Render configuration
        shell: bash

        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}

        run: |
          set -euo pipefail

          for name in \
            RENDER_API_KEY \
            RENDER_API_SERVICE_ID \
            RENDER_WEB_SERVICE_ID \
            PRODUCTION_API_URL \
            PRODUCTION_WEB_URL
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done

          echo "Required Render configuration is present."

      # Deploy the API first.
      # On Render Free, the existing API Dockerfile
      # can run Prisma migrations during startup.
      # RUN_MIGRATIONS_ON_STARTUP must be true.
      # Migrations must be backward-compatible.

      - name: Deploy NestJS API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          IMAGE_URL: ghcr.io/${{ needs.prepare.outputs.owner }}/assignment2-api:${{ needs.prepare.outputs.version }}

        run: node scripts/cd/render-deploy.mjs

      # Deploy the frontend after the API is live.

      - name: Deploy Next.js Web
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          IMAGE_URL: ghcr.io/${{ needs.prepare.outputs.owner }}/assignment2-web:${{ needs.prepare.outputs.version }}

        run: node scripts/cd/render-deploy.mjs

      # Health checks after deployment.

      - name: Production smoke test
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_URL }}
          WEB_BASE_URL: ${{ vars.PRODUCTION_WEB_URL }}

        run: npm run test:smoke:live

      # Save GitHub Actions release evidence.

      - name: Publish deployment summary
        if: success()
        shell: bash

        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OPERATION: ${{ needs.prepare.outputs.operation }}

        run: |
          echo "### BrewLite deployment successful" >> "$GITHUB_STEP_SUMMARY"

          echo "Operation: $OPERATION" >> "$GITHUB_STEP_SUMMARY"

          echo "Commit: $VERSION" >> "$GITHUB_STEP_SUMMARY"

          echo "API, Web and production smoke test completed." >> "$GITHUB_STEP_SUMMARY"
