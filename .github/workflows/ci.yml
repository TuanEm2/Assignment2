name: BrewLite CI

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This is a CI-only placeholder; the current unit/contract tests mock DB access.
    # Do not place production database credentials in CI test jobs.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/brewlite_ci?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint both workspaces
        run: npm run lint

      - name: Unit tests (NestJS and Next.js)
        run: npm run test

      - name: CD helper tests
        run: npm run test:cd

      - name: Cart logic tests (TV1)
        run: npm run test:cart

      - name: Integration contract tests (TV6)
        run: npm run test:integration

      - name: Validate Docker Compose definition
        env:
          POSTGRES_PASSWORD: ci-placeholder-only
          JWT_SECRET: ci-placeholder-only-not-used-by-runtime
        run: docker compose -f compose.yaml config --quiet

      - name: Build NestJS
        run: npm run build:api

      - name: Build Next.js
        run: npm run build:web
